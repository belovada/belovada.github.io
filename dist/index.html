<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="body">
  <header class="page-header">
    <div class="page-header__container">
      <a class="page-header__logo" href="#">
        <img class="page-header__logo-icon" src="images/logo.svg" alt="logo" />
      </a>
      <nav class="page-header__nav">
        <a class="page-header__nav-link" href="a">Мероприятия</a>
        <a class="page-header__nav-link" href="a">Блог</a>

      </nav>
      <div class="page-header__right-block">
        <a class="page-header__user-link btn" href="#">Войти</a>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="home">
      <header class="main-header home__main-header">
        <h1>АРТ-ПРОСТРАНСТВО</h1>
        <img />

      <section class="offers home__offers">

      <section class="about home__about">
        <h2 class="about__section-title section-title">О НАС</h2>
        <div class="about__container"></div>

      <section class="upcomming home__upcomming">
        <h2 class="upcomming__section-title section-title">МЕРОПРИЯТИЯ</h2>
        <div class="upcomming__container"></div>
      </section>

      <section class="listing home__listing">
        <h2 class="listing__section-title section-title">БЛОГ</h2>
        <div class="listing__container"></div>
      </section>

      <section class="contacts home__contacts">
        <h2 class="contacts__section-title section-title">КОНТАКТЫ</h2>
        <div class="contacts__container"></div>
